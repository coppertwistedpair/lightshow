name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish a Release on version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check code compiles
        run: python -m compileall -q main.py core gui

      - name: Build Lightshow.exe
        run: pyinstaller --noconfirm --onefile --windowed --name Lightshow main.py

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lightshow-windows
          path: dist/Lightshow.exe

      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Lightshow.exe
